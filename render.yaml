# Render.com deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: observatorio-inclusao-digital
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard         # standard = 2 GB RAM (recomendado para datasets grandes; starter tem apenas 512 MB)
    region: ohio           # Mais próximo do Brasil com baixa latência
    healthCheckPath: /_stcore/health
    autoDeploy: true

    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"

    # Disco persistente para manter o cache de dados entre deploys
    disk:
      name: observatorio-cache
      mountPath: /app/data/cache
      sizeGB: 5
