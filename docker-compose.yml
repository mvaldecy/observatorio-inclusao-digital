version: "3.9"

services:
  observatorio:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persiste o cache de dados entre reinicializações do container
      - observatorio_cache:/app/data/cache
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  observatorio_cache:
