[server]
# Aumenta o limite de upload e mensagem para suportar datasets grandes
maxUploadSize = 500
maxMessageSize = 500
# Desativa o watcher de arquivos para reduzir uso de memória no servidor
fileWatcherType = "none"
# Número de workers do servidor
headless = true

[browser]
# Desabilita coleta de estatísticas de uso
gatherUsageStats = false

[runner]
# Desativa a "mágica" de importação automática para acelerar inicialização
magicEnabled = false

[client]
# Desativa o spinner de loading padrão para evitar timeout aparente
showErrorDetails = true
toolbarMode = "minimal"

[theme]
# Tema claro como padrão – fundo branco, boas práticas de storytelling de dados
base = "light"
primaryColor = "#1B4F8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#1A202C"
font = "sans serif"
